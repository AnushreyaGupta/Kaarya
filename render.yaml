services:
  - type: web
    name: opportunet
    runtime: node
    plan: starter
    buildCommand: npm ci && npm run prisma:generate && npm run build
    startCommand: npm run db:deploy && npm start
    healthCheckPath: /health
    disk:
      name: opportunet-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        value: file:/var/data/opportunet.db
      - key: JWT_SECRET
        generateValue: true
